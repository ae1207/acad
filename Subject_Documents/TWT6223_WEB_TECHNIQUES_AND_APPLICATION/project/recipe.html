<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="recipe_style.css">
</head>
<body>
    <!-- Back Button at the top left -->
    <div class="back-button">
        <a href="TWTproject_dashboard.html" class="back-btn">Dashboard</a>
    </div>

    <div class="container">
        <h1>Recipe Finder</h1>
        <p>Find recipes based on food name, ingredients, or categories.</p>

        <!-- Search Section -->
        <div class="input-section">
            <input type="text" id="foodInput" placeholder="Enter food name" />
            <input type="text" id="ingredientsInput" placeholder="Enter ingredients (comma separated)" />
            <button id="searchButton">Search Recipes</button>
            <button id="randomMealButton">Get Random Meal</button>
        </div>

        <div id="errorMessage"></div>

        <!-- Recipe Results Section -->
        <div id="recipeResults">
            <h2>Recipes:</h2>
            <div id="recipes"></div>
        </div>

        <!-- Categories Section -->
        <div id="categories">
            <h2>Categories:</h2>
            <div id="categoryList"></div>
        </div>
    </div>

    <script src="recipe.js"></script>
</body>
</html>
